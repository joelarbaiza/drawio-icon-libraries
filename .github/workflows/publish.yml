# «Publicar versión»: botón en Actions para sacar una versión nueva sin tocar nada a mano.
#
#   Actions → Publicar versión → Run workflow → elegir patch / minor / major
#
# 1. Valida las librerías.
# 2. Calcula la versión siguiente a partir del último tag vX.Y.Z.
# 3. Convierte «## [Sin publicar]» del CHANGELOG en «## [X.Y.Z] - fecha» y sube la
#    versión de pyproject.toml (scripts/release.py). Falla si «Sin publicar» está vacía.
# 4. Hace commit en main, crea el tag y los sube juntos.
# 5. Publica la release con el ZIP (llama a release.yml).
#
# El paso 5 va en esta misma ejecución porque un tag subido con el token de
# GitHub Actions no dispara otros workflows.
name: Publicar versión

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de versión: minor = iconos o librerías nuevas · patch = correcciones · major = cambios incompatibles"
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Las versiones se publican desde main. Vuelve a lanzarlo eligiendo la rama main."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # necesita los tags para calcular la versión

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validar
        run: |
          python scripts/validate.py
          python scripts/build.py pack --check

      - name: Calcular versión
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python scripts/release.py next --bump "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "### Versión v$version ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar CHANGELOG.md y pyproject.toml
        run: python scripts/release.py prepare --version "${{ steps.version.outputs.version }}"

      - name: Commit, tag y push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  release:
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
