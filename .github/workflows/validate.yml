# Comprueba en cada PR y en cada push a main que las librerías son válidas
# y que coinciden con sus SVG de 64×64. No necesita Inkscape.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14: versión mínima declarada en pyproject.toml (soporte hasta 2030, disponible en Ubuntu 26.04).
        # 3.x: siempre la versión estable más reciente; prueba sola cada versión nueva de Python.
        python: ["3.14", "3.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Librerías válidas (formato, 64×64, títulos, sin raster, sin duplicados)
        run: python scripts/validate.py --verbose

      # Depende de que build.py pack convierta CRLF -> LF y de .gitattributes (eol=lf):
      # sin ambos, este paso daría falsos positivos según el SO. No eliminarlos.
      - name: XML sincronizados con sus SVG (build.py pack --check)
        run: python scripts/build.py pack --check --verbose

      - name: El ZIP de release se puede generar
        run: python scripts/package.py

      # Tabla de librerías, enlaces a diagrams.net y totales de los README (scripts/readme.py).
      - name: README al día con libraries.json
        run: python scripts/readme.py --check

      # Instalador de Windows: debe parsear en PowerShell, ir sin BOM (con BOM, «irm … | iex» falla en
      # PowerShell 5.1) y el .bat en CRLF (cmd.exe). pwsh viene instalado en los runners de Ubuntu.
      - name: Instalador de escritorio (sintaxis, sin BOM, .bat en CRLF)
        shell: pwsh
        run: |
          $ps1 = Join-Path $PWD 'scripts/install-drawio-desktop.ps1'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          $b = [IO.File]::ReadAllBytes($ps1)
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { '::error::install-drawio-desktop.ps1 lleva BOM'; exit 1 }
          $bat = [IO.File]::ReadAllText((Join-Path $PWD 'scripts/install-drawio-desktop.bat'))
          if (($bat -replace "`r`n", '') -match "`n") { '::error::install-drawio-desktop.bat no está en CRLF'; exit 1 }
          'OK: instalador válido'
