# Publica una GitHub Release con el ZIP de libraries/ adjunto.
#
# Se ejecuta de dos formas:
#   - Desde «Publicar versión» (publish.yml), que lo llama con el tag recién creado.
#   - Al subir a mano un tag v* (p. ej. git push origin v1.2.0).
#
# Las notas de la release salen de la sección de esa versión en CHANGELOG.md
# (si no existe, GitHub las genera a partir de los commits).
#
# El ZIP se adjunta siempre con el mismo nombre, así este enlace apunta
# a la última versión sin tocar el README:
#   https://github.com/<owner>/<repo>/releases/latest/download/drawio-icon-libraries.zip
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag a publicar (p. ej. v1.1.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validar antes de publicar
        run: |
          python scripts/validate.py
          python scripts/build.py pack --check

      - name: Generar ZIP
        run: python scripts/package.py

      - name: Notas desde CHANGELOG.md
        id: notes
        run: |
          if python scripts/release.py notes --version "${TAG#v}" > notes.md; then
            echo "args=--notes-file notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "args=--generate-notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG"
          dist/drawio-icon-libraries.zip
          --title "$TAG"
          ${{ steps.notes.outputs.args }}
          --verify-tag
